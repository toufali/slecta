steps:
# Build the container image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/$REPO_FULL_NAME/$SHORT_SHA', '.']
# Push the container image to Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/$REPO_FULL_NAME/$SHORT_SHA']
# Deploy container image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'deploy', 'slector', '--image', 'gcr.io/$PROJECT_ID/$REPO_FULL_NAME/$SHORT_SHA', '--region', 'us-central1']
# Point the nightly job at the same image. Env vars and other settings are kept from the
# existing job, so they live in one place rather than in this file.
# Retried: two builds overlapping will collide on the job's resource version, and the loser
# gets ABORTED. The conflict is transient — a retry re-reads the current version — but
# without this the build fails after the service is already deployed, leaving the job behind.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: bash
  args:
    - -c
    - |
      for attempt in 1 2 3; do
        gcloud run jobs update cache-scores \
          --image gcr.io/$PROJECT_ID/$REPO_FULL_NAME/$SHORT_SHA \
          --region us-central1 && exit 0
        sleep 5
      done
      exit 1
# Run it once now, so a deploy that breaks scoring shows up within minutes rather than at
# midnight UTC. Deliberately after the deploy, not before: verification also fails when a
# third-party source is down, and gating on that would block the very deploy that fixes it.
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: ['run', 'jobs', 'execute', 'cache-scores', '--wait', '--region', 'us-central1']
images:
- gcr.io/$PROJECT_ID/$REPO_FULL_NAME/$SHORT_SHA
timeout: 1800s # build is ~3min, but must also outlast the job's own task timeout
