name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Follows engines.node, so a runtime bump is a one-line change
          node-version-file: package.json
      - run: npm ci
      - run: npm test
